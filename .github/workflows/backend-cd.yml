name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging on dev
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    environment: staging
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render staging deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Record dashboard auto-deploy expectation
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_STAGING_DEPLOY_HOOK_URL is not configured; expecting Render dashboard auto-deploy for dev."

  deploy-production:
    name: Deploy production on main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render production deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Record dashboard auto-deploy expectation
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_PRODUCTION_DEPLOY_HOOK_URL is not configured; expecting Render dashboard auto-deploy for main."
